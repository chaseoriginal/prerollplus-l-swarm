services:
  prerollplus:
    image: chadwpalm/prerollplus:develop
    container_name: prerollplus-l-swarm_prerollplus
    environment:
    - PUID=1000
    - PGID=33
    - TZ=America/Chicago
    ports:
    - target: 4949
      published: 4949
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.labels.deployment.target.prerollplus == true
      restart_policy:
        condition: on-failure
    volumes:
    - /var/lib/docker/volumes/prerollplus-l-swarm/config/:/config
    - /media/Multimedia/Pre-Rolls/:/prerolls
volumes: {}
