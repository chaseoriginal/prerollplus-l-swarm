services:
  prerollplus:
    image: ${image}
    container_name: ${container_name}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - target: 4949
        published: 4949
        protocol: tcp
        mode: host        
    deploy:
      placement:
        constraints:
          - node.labels.deployment.target.prerollplus == true
      restart_policy:
        condition: on-failure
    volumes:
      - prerollplus_config:/config
      - /media/Multimedia/Pre-Rolls/:/prerolls

volumes:
  prerollplus_config: